name: Deploy web frontend to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache-bust CSS/JS asset references
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          sed -i "s/css\/style\.css\"/css\/style.css?v=${SHORT_SHA}\"/" web/index.html
          sed -i "s/js\/app\.js\"/js\/app.js?v=${SHORT_SHA}\"/" web/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./web"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
